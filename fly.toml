# fly.toml app configuration file generated for blackcat-petsitter on 2026-10-07T18:38:08Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'blackcat-petsitter'
primary_region = 'sin'

[build]

[env]
  NODE_ENV = 'production'
  PORT = '3000'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.checks]
    [http_service.checks.health]
      grace_period = "30s"
      interval = "15s"
      method = "GET"
      path = "/api/health"
      timeout = "5s"

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512